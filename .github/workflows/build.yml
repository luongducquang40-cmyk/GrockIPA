name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.3.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Archive (no signing)
        run: |
          xcodebuild clean archive \
            -project GrockProxy.xcodeproj \
            -scheme GrockProxy \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $PWD/build/GrockProxy.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            | xcpretty || true

      - name: Create IPA from archive
        run: |
          mkdir -p $PWD/build/Payload
          cp -r $PWD/build/GrockProxy.xcarchive/Products/Applications/GrockProxy.app $PWD/build/Payload/
          cd $PWD/build
          zip -r GrockProxy.ipa Payload
          ls -la GrockProxy.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GrockProxy-IPA
          path: build/GrockProxy.ipa
          retention-days: 5
